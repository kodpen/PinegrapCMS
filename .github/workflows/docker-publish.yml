# Publishes the Docker images of docker/ to the GitHub Container Registry
# when a GitHub release is published:
#
#   ghcr.io/kodpen/pinegrap-app   PHP-FPM with the software (also the cron and
#                                 install services of docker-compose.yml)
#   ghcr.io/kodpen/pinegrap-web   nginx with the static files
#
# Each image is tagged with the release tag (v2026.11.0), and with latest when
# the release is the repository's latest release (not a pre-release, not an
# older version published again). Both are built for linux/amd64 and
# linux/arm64, each on a runner of its own architecture (no emulation), pushed
# by digest and joined into one multi-platform image per tag.
#
# Run workflow (workflow_dispatch) with a tag publishes an existing release
# again, for example after a failed run. It accepts only the tag of a
# published release in the year.month.patch form.
#
# Pull requests that change what the images are built from run the same
# builds for both architectures without logging in or pushing.
#
# The token needs packages: write on these two packages. A package created by
# the first run is private until its visibility is changed in the
# organisation's package settings.
name: Docker publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (v2026.11.0)"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/docker-publish.yml"
      - "docker/**"
      - "!docker/docker-compose.yml"

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/kodpen/pinegrap

jobs:
  prepare:
    name: resolve the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      push: ${{ steps.release.outputs.push }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      # Event values reach the script as environment variables, never as
      # text inside it.
      - name: Resolve tag, commit and latest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            {
              echo "push=false"
              echo "version=pr-$PR_NUMBER"
              echo "sha=$PR_SHA"
              echo "latest=false"
            } >> "$GITHUB_OUTPUT"
            echo "Pull request #$PR_NUMBER: build only, nothing is pushed."
            exit 0
          fi

          if [ "$EVENT" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            tag="$INPUT_TAG"
          fi

          if ! [[ "$tag" =~ ^v[0-9]{4}\.[1-9][0-9]?\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a release tag of the form v<year>.<month>.<patch>"
            exit 1
          fi

          # A draft has no release behind its tag; the endpoint answers 404.
          if ! gh api "repos/$REPOSITORY/releases/tags/$tag" --jq '.tag_name' > /dev/null; then
            echo "::error::$tag has no published release"
            exit 1
          fi

          sha="$(gh api "repos/$REPOSITORY/commits/$tag" --jq '.sha')"

          # The latest release excludes pre-releases and drafts.
          latest_tag="$(gh api "repos/$REPOSITORY/releases/latest" --jq '.tag_name' 2> /dev/null || true)"
          latest=false
          if [ "$latest_tag" = "$tag" ]; then
            latest=true
          fi

          # A fork has no write access to the kodpen packages.
          push=false
          if [ "$OWNER" = "kodpen" ]; then
            push=true
          fi

          {
            echo "push=$push"
            echo "version=$tag"
            echo "sha=$sha"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          echo "$tag at $sha, latest: $latest, push: $push"

  build:
    name: build on ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      PUSH: ${{ needs.prepare.outputs.push }}
      LABELS: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
        org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
        org.opencontainers.image.licenses=MIT
        org.opencontainers.image.vendor=Kodpen
    steps:
      - name: Check out the release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The build context is the repository root, as in docker-compose.yml;
      # BuildKit reads docker/Dockerfile.dockerignore next to the Dockerfile.
      # A release pushes the image by digest only (the merge job gives the
      # tags); a pull request keeps the result in the build cache.
      - name: Build the app image
        id: app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: app
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0}-app,push-by-digest=true,name-canonical=true,push=true', env.IMAGE_PREFIX) || 'type=cacheonly' }}
          labels: |
            ${{ env.LABELS }}
            org.opencontainers.image.title=Pinegrap app
            org.opencontainers.image.description=Pinegrap CMS: PHP-FPM with the software, also the cron and install services of docker/docker-compose.yml

      # Reuses the app stage the previous step left in the builder.
      - name: Build the web image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: web
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0}-web,push-by-digest=true,name-canonical=true,push=true', env.IMAGE_PREFIX) || 'type=cacheonly' }}
          labels: |
            ${{ env.LABELS }}
            org.opencontainers.image.title=Pinegrap web
            org.opencontainers.image.description=Pinegrap CMS: nginx with the static files, passing PHP to the app container

      - name: Record the digests
        if: ${{ env.PUSH == 'true' }}
        env:
          DIGESTS: ${{ runner.temp }}/digests
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$DIGESTS/app" "$DIGESTS/web"
          touch "$DIGESTS/app/${APP_DIGEST#sha256:}" "$DIGESTS/web/${WEB_DIGEST#sha256:}"

      - name: Upload the digests
        if: ${{ env.PUSH == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  merge:
    name: tag the multi-platform images
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.push == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # One index per image over the per-architecture digests. The index
      # annotations are what the package page shows for a multi-platform
      # image.
      - name: Create and push the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ needs.prepare.outputs.latest }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          for image in app web; do
            name="$IMAGE_PREFIX-$image"

            case "$image" in
              app) description="Pinegrap CMS: PHP-FPM with the software, also the cron and install services of docker/docker-compose.yml" ;;
              web) description="Pinegrap CMS: nginx with the static files, passing PHP to the app container" ;;
            esac

            tags=(-t "$name:$VERSION")
            if [ "$LATEST" = "true" ]; then
              tags+=(-t "$name:latest")
            fi

            sources=()
            for digest in "$image"/*; do
              sources+=("$name@sha256:${digest##*/}")
            done

            docker buildx imagetools create "${tags[@]}" \
              --annotation "index:org.opencontainers.image.source=$SOURCE" \
              --annotation "index:org.opencontainers.image.description=$description" \
              --annotation "index:org.opencontainers.image.licenses=MIT" \
              --annotation "index:org.opencontainers.image.version=$VERSION" \
              "${sources[@]}"

            docker buildx imagetools inspect "$name:$VERSION"

            {
              echo "- \`$name:$VERSION\`"
              if [ "$LATEST" = "true" ]; then
                echo "- \`$name:latest\`"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done

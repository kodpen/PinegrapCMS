# Installs Pinegrap through the installation screen on several MySQL and
# MariaDB versions (tools/check_install.sh), once into an empty database and
# once more over the tables of the first run. A fresh installation loads the
# starter site, taken at 2021.3, and runs every schema step after it up to the
# last version of versions.php, so a statement that one server refuses fails
# here instead of on a customer's host: MySQL 5.7 answered the DROP DEFAULT of
# version 2022.2 with error 1101 while MySQL 8 and MariaDB took it.
#
# tools/ is tracked on the development branch only; on main and the release
# branches the steps are skipped and the job still reports.
#
# On a pull request the six databases run only when the installer, the
# migration steps, tools/, the starter dumps or this file changed; a merge
# train and a push to main or development always run them. A trigger-level
# paths filter cannot express this, because a merge train must run whatever
# it changes, so the first job reads the diff with plain git.
name: Install check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  changes:
    name: files the install check depends on
    # A draft pull request claims a task (CLAUDE.md) and is not checked until
    # it is marked ready; a merge train is a draft that is checked.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || startsWith(github.head_ref, 'merge-train/') }}
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.diff.outputs.install }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List the changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "install=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A diff that cannot be read runs the matrix rather than skip it.
          if ! changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
            echo "The diff could not be read; the install check runs."
            echo "install=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^(pinegrap/install/|pinegrap/includes/migrations/|tools/|pinegrap/data/backups/|\.github/workflows/install-check\.yml$)'; then
            echo "install=true" >> "$GITHUB_OUTPUT"
          else
            echo "No installer, migration, tools or starter dump file changed; the install check is skipped."
            echo "install=false" >> "$GITHUB_OUTPUT"
          fi

  install:
    name: install and upgrade on ${{ matrix.db }}
    needs: changes
    if: ${{ needs.changes.outputs.install == 'true' || github.event_name == 'push' || startsWith(github.head_ref, 'merge-train/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql:5.7", "mysql:8.0", "mysql:8.4", "mariadb:10.3", "mariadb:10.6", "mariadb:11.4"]
    services:
      db:
        image: ${{ matrix.db }}
        # The mysql images read the MYSQL_ names, the mariadb images the MARIADB_ ones.
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pinegrap
          MYSQL_USER: pinegrap
          MYSQL_PASSWORD: pinegrap
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: pinegrap
          MARIADB_USER: pinegrap
          MARIADB_PASSWORD: pinegrap
        ports:
          - 3306:3306
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up PHP
        if: ${{ hashFiles('tools/check_install.sh') != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, mysqli, gd, intl, xml, zip, curl
          coverage: none
          tools: none

      # The images have no common health command, so the job asks the server itself.
      - name: Wait for the database server
        if: ${{ hashFiles('tools/check_install.sh') != '' }}
        run: |
          for _ in $(seq 1 90); do
            if php -r 'mysqli_report(MYSQLI_REPORT_OFF); exit(@mysqli_connect("127.0.0.1", "pinegrap", "pinegrap", "pinegrap") ? 0 : 1);'; then
              exit 0
            fi
            sleep 2
          done
          echo "The database server did not come up." >&2
          exit 1

      - name: Install and upgrade to the last version (tools/check_install.sh)
        if: ${{ hashFiles('tools/check_install.sh') != '' }}
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: pinegrap
          DB_PASSWORD: pinegrap
          DB_DATABASE: pinegrap
        run: bash tools/check_install.sh english_default

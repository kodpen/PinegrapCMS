# Static checks and unit tests that gate every pull request: PHP syntax across
# the product tree, translation-key consistency, designer binding tokens, the
# external API schema, the unit tests under tests/, the function copies in
# get_file.php and a JavaScript syntax check of the large panel scripts. None
# of them needs a database.
name: PHP checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: lint, consistency checks, unit tests and JS syntax (PHP 8.3, Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, mysqli, gd, intl, xml, zip
          coverage: none
          tools: none

      - name: Syntax check (php -l over the product tree)
        run: php tools/lint.php

      - name: Translation keys (lang / _sdT against tr.json)
        run: php tools/check_lang.php

      - name: Designer bindings (dropdown tokens against renderer tokens)
        run: php tools/check_bindings.php

      - name: External API schema (endpoint fields against the schema)
        run: php tools/check_api_schema.php

      - name: Unit tests (tests/*_test.php)
        run: php tools/test.php

      - name: get_file.php copies (only the intended ones)
        run: php tools/check_copies.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript syntax (node --check)
        run: |
          node --check pinegrap/assets/js/style_designer.js
          node --check pinegrap/assets/js/workspace.js
          node --check pinegrap/assets/js/backend.src.js

# Static checks and unit tests that gate every pull request: PHP syntax across
# the product tree, translation-key consistency, designer binding tokens, the
# external API schema, the unit tests under tests/, the function copies in
# get_file.php, static analysis (PHPStan level 0) and PHP 7.1+ compatibility
# (PHPCompatibility) of the product tree against their baselines, a
# JavaScript syntax check of the large panel scripts, whether every .min.js
# and the code editor bundle still match their sources and whether the memory
# index (docs/memory/README.md) matches the files it lists, and on a pull
# request the guards on its branch's commits, changelog and size. None of them
# needs a database. tools/pre_push.sh runs the fast ones before a push
# (docs/memory/workflow/pre-push-checks.md): a step or a node --check file
# added here that takes seconds is added there too.
#
# The two analysers are not part of the product: tools/static_analysis.sh
# downloads the pinned releases on each run (PHPStan and PHP_CodeSniffer as
# phars checked against their SHA-256, the PHPCompatibility and PHPCSUtils
# standards by commit).
#
# tools/ and tests/ are tracked on the development branch only; main and the
# release branches carry the product alone. There the PHP steps find no
# tools/ and are skipped, so the job still reports and the JavaScript syntax
# check still runs.
name: PHP checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  checks:
    name: lint, consistency checks, unit tests and JS syntax (PHP 8.3, Node 24)
    # A draft pull request claims a task (CLAUDE.md) and is not checked until
    # it is marked ready; a merge train is a draft that is checked.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || startsWith(github.head_ref, 'merge-train/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up PHP
        if: ${{ hashFiles('tools/lint.php') != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, mysqli, gd, intl, xml, zip
          coverage: none
          tools: none

      - name: Syntax check (php -l over the product tree)
        if: ${{ hashFiles('tools/lint.php') != '' }}
        run: php tools/lint.php

      - name: Translation keys (lang / _sdT against the language shards)
        if: ${{ hashFiles('tools/check_lang.php') != '' }}
        run: php tools/check_lang.php

      - name: Designer bindings (dropdown tokens against renderer tokens)
        if: ${{ hashFiles('tools/check_bindings.php') != '' }}
        run: php tools/check_bindings.php

      - name: External API schema (endpoint fields against the schema)
        if: ${{ hashFiles('tools/check_api_schema.php') != '' }}
        run: php tools/check_api_schema.php

      - name: Audit rule registry (editor rules and codes against their checkers)
        if: ${{ hashFiles('tools/check_audit_rules.php') != '' }}
        run: php tools/check_audit_rules.php

      - name: Unit tests (tests/*_test.php)
        if: ${{ hashFiles('tools/test.php') != '' }}
        run: php tools/test.php

      - name: get_file.php copies (only the intended ones)
        if: ${{ hashFiles('tools/check_copies.php') != '' }}
        run: php tools/check_copies.php

      - name: Panel markup is Bootstrap 6 (tools/check_bs6.php --strict)
        if: ${{ hashFiles('tools/check_bs6.php') != '' }}
        run: php tools/check_bs6.php --strict

      # tools/static_analysis.sh fetches the pinned analysers into the
      # runner's temporary folder; PHPStan's errors become annotations on the
      # pull request's diff.
      - name: Static analysis (PHPStan level 0 against tools/phpstan-baseline.neon)
        if: ${{ hashFiles('tools/static_analysis.sh') != '' }}
        run: bash tools/static_analysis.sh phpstan

      - name: PHP 7.1+ compatibility (PHPCompatibility against tools/phpcs-baseline.json)
        if: ${{ hashFiles('tools/static_analysis.sh') != '' }}
        run: bash tools/static_analysis.sh phpcompat

      # The syntax check, terser (npx, tools/build_js.php) and npm ci + esbuild
      # (tools/build_code_editor.php) all run on this Node, an LTS line.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: JavaScript syntax (node --check)
        run: |
          node --check pinegrap/assets/js/style_designer.src.js
          node --check pinegrap/assets/js/workspace.js
          node --check pinegrap/assets/js/backend.src.js

      - name: Minified scripts match their sources (tools/build_js.php --check)
        if: ${{ hashFiles('tools/build_js.php') != '' }}
        run: php tools/build_js.php --check

      - name: Minified stylesheets match their sources (tools/build_css.php --check)
        if: ${{ hashFiles('tools/build_css.php') != '' }}
        run: php tools/build_css.php --check

      - name: Code editor bundle matches its sources (tools/build_code_editor.php --check)
        if: ${{ hashFiles('tools/build_code_editor.php') != '' }}
        run: php tools/build_code_editor.php --check

      - name: Memory index matches its files (tools/memory_index.php --check)
        if: ${{ hashFiles('tools/memory_index.php') != '' }}
        run: php tools/memory_index.php --check

  # What the pull request's branch carries (tools/check_pr.php): no commit
  # with a Co-Authored-By: or Claude-Session: trailer, Erdal Güral as every
  # commit's author and committer (GitHub's own committer allowed, for a merge
  # made in the web UI), no change to pinegrap/changelog.txt, and a warning
  # above about 1,000 product lines. A merge train and a Dependabot pull
  # request skip all but the trailer check. Its commits are those
  # origin/development does not reach, so the full history is fetched.
  guards:
    name: branch guards (trailers, commit author, changelog, size)
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' && (!github.event.pull_request.draft || startsWith(github.head_ref, 'merge-train/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        if: ${{ hashFiles('tools/check_pr.php') != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: none

      - name: Branch guards (tools/check_pr.php)
        if: ${{ hashFiles('tools/check_pr.php') != '' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -- origin/development "$HEAD_SHA" "--branch=$HEAD_REF"
          if [ "$PR_AUTHOR" = 'dependabot[bot]' ]; then
            set -- "$@" --identity-exempt
          fi
          php tools/check_pr.php "$@"

  # The oldest PHP the product supports. The job above runs on 8.3 and skips
  # the bundled libraries, and PHPCompatibility reads the product tree alone,
  # so neither sees a bundled file that does not parse on 7.1 or code that
  # behaves differently there. The unit tests run without a database, as above.
  php71:
    name: syntax with bundled libraries and unit tests (PHP 7.1)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || startsWith(github.head_ref, 'merge-train/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up PHP
        if: ${{ hashFiles('tools/lint.php') != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.1"
          extensions: mbstring, mysqli, gd, intl, xml, zip, pdo_mysql
          coverage: none
          tools: none

      - name: Syntax check, bundled libraries included (php tools/lint.php --vendored)
        if: ${{ hashFiles('tools/lint.php') != '' }}
        run: php tools/lint.php --vendored

      - name: Unit tests (tests/*_test.php)
        if: ${{ hashFiles('tools/test.php') != '' }}
        run: php -d memory_limit=-1 tools/test.php

  # Tells the agent channel how the checks of a ready pull request ended: one
  # "[ci] …" line written with the CI application's own key
  # (tools/ws_post.php). Agents waiting with tools/ws_wait.php --prefix=[ci]
  # wake on it. Skipped in silence while the repository has no
  # PG_WS_SITE / PG_WS_CHANNEL / PG_WS_CI_KEY / PG_WS_CI_SECRET secrets, and
  # it never fails the run: the channel is a convenience, not a gate.
  channel:
    name: report to the agent channel
    needs: [checks, guards, php71]
    if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'development' && !github.event.pull_request.draft && needs.checks.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        if: ${{ hashFiles('tools/ws_post.php') != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl
          coverage: none
          tools: none

      - name: Write the [ci] line (tools/ws_post.php)
        if: ${{ hashFiles('tools/ws_post.php') != '' }}
        continue-on-error: true
        env:
          PG_WS_SITE: ${{ secrets.PG_WS_SITE }}
          PG_WS_CHANNEL: ${{ secrets.PG_WS_CHANNEL }}
          PG_WS_KEY: ${{ secrets.PG_WS_CI_KEY }}
          PG_WS_SECRET: ${{ secrets.PG_WS_CI_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKS: ${{ needs.checks.result }}
          GUARDS: ${{ needs.guards.result }}
          PHP71: ${{ needs.php71.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          state=green
          for result in "$CHECKS" "$GUARDS" "$PHP71"; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              state=red
            fi
          done
          php tools/ws_post.php --skip-missing "--idempotency-key=$RUN_KEY" -- \
            "[ci] $state #$PR_NUMBER $HEAD_REF ${HEAD_SHA:0:7} checks=$CHECKS guards=$GUARDS php71=$PHP71 $RUN_URL $PR_TITLE"

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Quiet</title></head>
<body>
<p>Canvas 22's page: it asks nothing and keeps what reaches it.</p>
<script>
window.__got = [];
window.addEventListener('message', function (e) { if (e.data && e.data.pg === 'canvas-data') { window.__got.push(JSON.stringify(e.data)); } });
</script>
</body></html>

# Pinegrap - Enterprise Website Platform
#
# The server block of the web image. The rules between the two markers are
# the ones the installer writes for nginx (pg_server_config_default('nginx')
# in pinegrap/includes/server_config.php, for a site at / in the folder
# pinegrap); tests/docker_nginx_test.php fails when the two drift apart.
#
# @author      Erdal Güral (Kodpen)
# @link        https://kodpen.com
# @copyright   2017–2026 Kodpen
# @license     https://opensource.org/licenses/mit-license.html MIT License

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php;

    # post_max_size and upload_max_filesize in docker/php-settings.conf.
    client_max_body_size 64m;
    server_tokens off;

    # The app container gets a new address each time it is recreated. With
    # the address in a variable nginx asks Docker's DNS per request instead of
    # keeping the one it found at start, which would answer 502 from then on.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pinegrap_app app:9000;

    # --- Pinegrap rules (includes/server_config.php) ---

    # The software reads these folders from disk; they are never fetched over HTTP.
    location ~ ^/(pinegrap/)?(data|pinegrap/includes)/ {
        deny all;
        return 403;
    }

    # Version control folders, environment files, dumps and editor leftovers.
    location ~ (^|/)\.(git|svn|hg|env)(/|$) {
        deny all;
        return 403;
    }
    location ~ \.(sql|bak|log|env|ini|swp|dist|orig|rej)$ {
        deny all;
        return 403;
    }

    # Static files: compressed and kept by the browser for a week, as
    # get_file.php keeps its own (library files carry no ?v= stamp). PHP output
    # is not compressed: pages carry CSRF tokens, and a compressed stream is
    # held back until the buffer fills. A missing file still goes to the router,
    # which serves uploaded files at root addresses.
    location ~* ^/.+\.(css|js|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|eot)$ {
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;
        expires 7d;
        try_files $uri /pinegrap/router.php;
    }

    # Everything that is not a real file goes to the router.
    location / {
        try_files $uri $uri/ /pinegrap/router.php;
    }

    # Referrer-Policy comes from the software, which narrows it to no-referrer
    # on the pages that must not pass their address on. add_header would be
    # appended after it and win.
    add_header X-Content-Type-Options "nosniff" always;

    # --- end of the Pinegrap rules ---

    # PHP runs in the app service. A .php address with no file behind it goes
    # to the router like any other address, as the Apache and IIS rules send
    # every missing file there. The deny rules above come first, so nothing
    # under data/ or includes/ is ever executed from a URL.
    location ~ \.php$ {
        try_files $fastcgi_script_name /pinegrap/router.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $pinegrap_app;
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}

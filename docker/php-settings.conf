; Pinegrap - Enterprise Website Platform
;
; PHP settings of the app image, copied to conf.d/pinegrap.ini and read after
; the base image's defaults. System Status checks short_open_tag and
; allow_url_fopen; the upload limits match client_max_body_size in
; nginx.conf. The name ends in .conf because .gitignore leaves out *.ini.
;
; @author      Erdal Güral (Kodpen)
; @link        https://kodpen.com
; @copyright   2017–2026 Kodpen
; @license     https://opensource.org/licenses/mit-license.html MIT License

short_open_tag = On
allow_url_fopen = On
expose_php = Off

memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 50

date.timezone = UTC

; Errors go to the container log (docker compose logs app).
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Files change when an update is installed from the panel.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

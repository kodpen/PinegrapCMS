<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Telefon · Tuval</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: #1a1c1e">
<dc-import name="Main" profile="canvas" demo="blank" width="390" height="844" theme="{{theme}}" lang="{{lang}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"light"},"lang":{"editor":"enum","options":["tr","en"],"default":"tr"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', lang: this.props.lang ?? 'tr' };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<title>panel look A, second pass: the bell's drawer</title>
<link rel="stylesheet" href="../../../../pinegrap/assets/fonts/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="sheet.css">
<style>
body { background: radial-gradient(700px 420px at 20% -6%, var(--glow1), transparent 62%), radial-gradient(600px 380px at 100% -4%, var(--glow2), transparent 60%), var(--page); }
.stage { padding: 30px 34px 36px; }
.drawer { width: 430px; height: 956px; display: flex; flex-direction: column; overflow: hidden; border-radius: 20px; border: 1px solid var(--line); box-shadow: var(--shadow); background: linear-gradient(180deg, var(--surf1), var(--surf2)); }
.drawer .head { display: flex; align-items: center; gap: 2px; padding: 16px 12px 12px 20px; }
.drawer .head h2 { margin: 0 auto 0 0; font: 650 17px/1.3 "Inter Display", Inter, sans-serif; letter-spacing: -.015em; }
.drawer .filters { display: flex; align-items: center; gap: 8px; padding: 0 16px 12px 16px; }
.drawer .filters .btn { margin-left: auto; font-weight: 500; color: var(--fg2); }
.scroll { flex: 1; overflow: hidden; }
.day { padding: 12px 20px 6px; font-size: 12px; font-weight: 550; color: var(--fg3); }
.row { display: flex; gap: 11px; margin: 0 8px; padding: 10px 12px; border-radius: 12px; }
.row.hov { background: var(--hover); }
.row .tile, .row .av { margin-top: 2px; }
.row .av { width: 28px; height: 28px; font-size: 10.5px; }
.row .body { flex: 1; min-width: 0; }
.l1 { display: flex; align-items: baseline; gap: 10px; }
.title { flex: 1; min-width: 0; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title span { font-weight: 400; color: var(--fg2); }
.time { flex: none; font-size: 12px; color: var(--fg3); }
.text { margin-top: 1px; font-size: 13px; color: var(--fg2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.text b { color: var(--fg); font-weight: 550; }
.l3 { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.place { font-size: 12px; color: var(--fg3); }
.side { flex: none; width: 8px; padding-top: 6px; }
.dot { display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.row.read .title { font-weight: 450; color: var(--fg2); }
.row.read .tile { filter: saturate(.55); opacity: .8; }
.count { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 600; line-height: 17px; vertical-align: 1px; color: var(--fg2); background: var(--quiet); box-shadow: inset 0 0 0 1px var(--line); }
.fold { margin: 8px 0 2px; padding-left: 10px; border-left: 2px solid var(--line); }
.fold div { display: flex; gap: 8px; padding: 3px 0; font-size: 13px; color: var(--fg2); white-space: nowrap; }
.fold div b { color: var(--fg); font-weight: 550; }
.fold div span:last-child { margin-left: auto; color: var(--fg); }
.link { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 12.5px; font-weight: 500; color: var(--fg2); }
.quick { display: flex; gap: 2px; flex: none; margin: -5px -6px -5px 0; }
.quick .ib { width: 26px; height: 26px; font-size: 14px; border-radius: 8px; }
.foot { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--fg2); }
.foot i { font-size: 15px; }
.foot .sw { margin-left: auto; }
</style>
</head>
<body>
<div class="stage"><section class="drawer" id="drawer"></section></div>
<script>
var N = [
  { day: 'Bugün', tone: 'blue', icon: 'robot', who: 'Stok ajanı', verb: 'size sordu', place: '#satis', t: '16 dk', text: 'Depoda 3 ürün kritik seviyenin altına düştü: KAH-250, KUP-12 ve FLT-02. Tedarikçiye bu hafta sipariş açalım mı?', act: 'Yanıtla', pri: 1, un: 1 },
  { day: 'Bugün', av: 'AD', who: 'Ayşe Demir', verb: 'sizi andı', place: '#satis', t: '41 dk', text: 'Yarınki teklif toplantısı için güncel fiyat listesini paylaşabilir misin? Müşteri özellikle toptan indirim oranlarını ve teslim sürelerini soruyor.', act: 'Yanıtla', un: 1, hov: 1 },
  { day: 'Bugün', tone: 'amber', icon: 'exclamation-triangle', who: 'Vadesi geçen alacaklar', t: '3 sa', value: '18.450,00 ₺', text: '3 alacak hatırlatma eşiğini geçti, biri bir aydır açık.', act: 'Göster', un: 1 },
  { day: 'Dün', tone: 'teal', icon: 'bag', who: 'Yeni sipariş', count: 2, t: 'Dün', value: '2.404,50 ₺', text: 'son sipariş 16:20', un: 1,
    fold: [['#SP-1044', 'Mehmet Kaya · 3 ürün', '2.015,50 ₺'], ['#SP-1043', 'Elif Şahin · 1 ürün', '389,00 ₺']], less: 'Gizle' },
  { day: 'Dün', tone: 'rose', icon: 'ui-checks', who: 'Form gönderildi', count: 3, t: 'Dün', text: 'İletişim formu (2), Teklif formu', un: 1, more: '3 gönderimi göster' },
  { day: 'Dün', tone: 'amber', icon: 'box-seam', who: 'Stok tükendi', t: 'Dün', text: 'Seramik Kupa (Mavi) son satışla tükendi.', un: 0 },
  { day: 'Daha önce', tone: 'gray', icon: 'arrow-repeat', who: 'Güncelleme hazır', t: '9 Kas', text: 'Pinegrap 2026.11.0 kurulabilir.', un: 0 }
];
function tile(n) { return n.av ? '<span class="av">' + n.av + '</span>' : '<span class="tile t-' + n.tone + '"><i class="bi bi-' + n.icon + '"></i></span>'; }
function drawer() {
  var out = '<div class="head"><h2>Bildirimler</h2><button class="ib" title="Tümünü okundu say"><i class="bi bi-check2-all"></i></button><button class="ib"><i class="bi bi-three-dots"></i></button><button class="ib"><i class="bi bi-x-lg"></i></button></div>'
    + '<div class="filters"><span class="seg"><span class="on">Tümü <em>8</em></span><span>Site <em>6</em></span><span>Çalışma Alanı <em>2</em></span></span><button class="btn quiet sm"><i class="bi bi-funnel"></i>Okunmamış</button></div><div class="scroll">', day = '';
  N.forEach(function (n) {
    if (n.day !== day) { day = n.day; out += '<div class="day">' + day + '</div>'; }
    out += '<div class="row' + (n.un ? '' : ' read') + (n.hov ? ' hov' : '') + '">' + tile(n) + '<div class="body">'
      + '<div class="l1"><div class="title">' + n.who + (n.verb ? ' <span>' + n.verb + '</span>' : '') + (n.count ? '<span class="count">' + n.count + '</span>' : '') + '</div>'
      + (n.hov ? '<span class="quick"><button class="ib on" title="Okundu say"><i class="bi bi-check2"></i></button><button class="ib" title="Diğer işlemler"><i class="bi bi-three-dots"></i></button></span>' : '<span class="time">' + n.t + '</span>') + '</div>'
      + '<div class="text">' + (n.value ? '<b class="num">' + n.value + '</b> · ' : '') + n.text + '</div>'
      + (n.fold ? '<div class="fold">' + n.fold.map(function (f) { return '<div><b>' + f[0] + '</b><span>' + f[1] + '</span><span class="num">' + f[2] + '</span></div>'; }).join('') + '</div><button class="link">' + n.less + ' <i class="bi bi-chevron-up"></i></button>' : '')
      + (n.more ? '<button class="link">' + n.more + ' <i class="bi bi-chevron-down"></i></button>' : '')
      + (n.act ? '<div class="l3"><button class="btn sm ' + (n.pri ? 'fill' : 'quiet') + '">' + n.act + '</button>' + (n.place ? '<span class="place">' + n.place + '</span>' : '') + '</div>' : '')
      + '</div><div class="side">' + (n.un ? '<span class="dot"></span>' : '') + '</div></div>';
  });
  return out + '</div><div class="foot"><i class="bi bi-bell"></i>Bu cihazda bildirimler<span class="sw"></span></div>';
}
document.getElementById('drawer').innerHTML = drawer();
</script>
</body>
</html>

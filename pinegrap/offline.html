<!doctype html>
<!--
 Pinegrap - Enterprise Website Platform

 The panel's offline notice. The service worker (sw.js) keeps this one file,
 and nothing else, in its cache and answers it when a panel page cannot be
 reached because the network is gone. It is a fixed notice, not a panel
 page: no operator's data is ever in it.

 The {{...}} marks are filled by the worker with the texts the panel handed
 it at registration (lang() on the PHP side), escaped for HTML; the
 worker's English defaults stand in for a text it was not given.

 @author      Erdal Güral (Kodpen)
 @link        https://kodpen.com
 @copyright   2017–2026 Kodpen
 @license     https://opensource.org/licenses/mit-license.html MIT License
-->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}}</title>
<style>
    /* The panel's colour tokens, written out: the stylesheet is not
       reachable offline. */
    :root {
        color-scheme: light dark;
        --pg-body-bg: #ffffff;
        --pg-body-color: #1f2328;
        --pg-secondary-color: #656d76;
        --pg-border-color: #d0d7de;
        --pg-primary: #1a73e8;
        --pg-primary-contrast: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --pg-body-bg: #101114;
            --pg-body-color: #e6edf3;
            --pg-secondary-color: #9198a1;
            --pg-border-color: #3d444d;
            --pg-primary: #64b5f6;
            --pg-primary-contrast: #101114;
        }
    }

    html, body { height: 100%; margin: 0; }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--pg-body-bg);
        color: var(--pg-body-color);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    main {
        max-width: 26rem;
        padding: 32px 24px;
        border: 1px solid var(--pg-border-color);
        border-radius: 12px;
        text-align: center;
    }

    svg { width: 48px; height: 48px; color: var(--pg-secondary-color); }

    h1 { font-size: 1.25rem; margin: 16px 0 8px; }

    p { margin: 0 0 24px; color: var(--pg-secondary-color); }

    button {
        font: inherit;
        padding: 8px 20px;
        border: 0;
        border-radius: 8px;
        background: var(--pg-primary);
        color: var(--pg-primary-contrast);
        cursor: pointer;
    }

    button:focus-visible { outline: 2px solid var(--pg-primary); outline-offset: 2px; }

    @media (forced-colors: active) {
        button { border: 1px solid ButtonText; }
    }
</style>
</head>
<body>
<main>
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M10.706 3.294A12.6 12.6 0 0 0 8 3C5.259 3 2.723 3.882.663 5.379a.485.485 0 0 0-.048.736.52.52 0 0 0 .668.05A11.45 11.45 0 0 1 8 4q.946 0 1.852.148zM8 6c-1.905 0-3.68.56-5.166 1.526a.48.48 0 0 0-.063.745.525.525 0 0 0 .652.065 8.45 8.45 0 0 1 3.51-1.27zm2.596 1.404.785-.785q.947.362 1.785.907a.482.482 0 0 1 .063.745.525.525 0 0 1-.652.065 8.5 8.5 0 0 0-1.98-.932zM8 10l.933-.933a6.5 6.5 0 0 1 2.013.637c.285.145.326.524.1.75l-.015.015a.53.53 0 0 1-.611.09A5.5 5.5 0 0 0 8 10m4.905-4.905.747-.747q.886.451 1.685 1.03a.485.485 0 0 1 .047.737.52.52 0 0 1-.668.05 11.5 11.5 0 0 0-1.811-1.07M9.02 11.78c.238.14.236.464.04.66l-.707.706a.5.5 0 0 1-.707 0l-.707-.707c-.195-.195-.197-.518.04-.66A2 2 0 0 1 8 11.5c.374 0 .723.102 1.021.28zm4.355-9.905a.53.53 0 0 1 .75.75l-10.75 10.75a.53.53 0 0 1-.75-.75z"/></svg>
    <h1>{{title}}</h1>
    <p>{{body}}</p>
    <button type="button" onclick="location.reload()">{{retry}}</button>
</main>
</body>
</html>
